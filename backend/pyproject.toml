[project]
name = "resa-backend"
version = "2.0.0"
description = "Resa – KI-Assistentin für Hausverwaltungen"
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",
    "sqlalchemy[asyncio]==2.0.43",
    "asyncpg==0.30.0",
    "alembic==1.16.5",
    "pydantic-settings==2.10.1",
    # für pydantic.EmailStr in der Anmeldung
    "email-validator==2.3.0",
    "anthropic==0.69.0",
    "qdrant-client==1.19.0",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "argon2-cffi==25.1.0",
    "pyjwt==2.10.1",
    "pypdf==6.0.0",
    "python-docx==1.2.0",
    "aiosmtplib==4.0.1",
    "python-slugify==8.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "ruff==0.13.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI-Idiom: Depends()/File()/Query() stehen bewusst im Argument-Default.
"app/api/*" = ["B008"]
"app/deps.py" = ["B008"]
